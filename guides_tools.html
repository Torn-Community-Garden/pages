<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Guides/Tools | TCG</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="icon" type="image/png" href="./resources/Graphics/fav.png">
        <link rel="stylesheet" href="w3.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body data-page="guides_tools" data-theme class="body-light">
        <script src="functions.js" type="module"></script>
        <script src="index.js" type="module"></script>
        <div id="loadingModal" class="w3-modal">
            <span
                class="w3-center w3-display-middle fa fa-spinner w3-spin w3-xxxlarge"
                style="color: white;"></span>
        </div>
        <br>
        <nav class="w3-top w3-mobile">
            <!-- Main top bar -->
            <div class="w3-bar w3-card w3-bold main-light"
                style="max-height: 39px;">
                <!-- Left side -->
                <button
                    id="homePage-Btn" data-main="index.html"
                    class="w3-bar-item w3-button fa fa-home sub-light
                    cornerfold-top" style="font-size: 23px;"></button>
                <button
                    id="warPage-Btn" data-main="war.html"
                    class="w3-bar-item w3-button w3-hide-small main-light-hover">War</button>
                <button id="gntPage-Btn" data-main="guides_tools.html"
                    class="w3-bar-item w3-button w3-hide-small main-light-hover w3-disabled">Guides/Tools</button>
                <button
                    id="abtUsPage-Btn" data-main="about_us.html"
                    class="w3-bar-item w3-button w3-hide-small main-light-hover w3-disabled">About
                    Us</button>
                <!-- Right side -->
                <button
                    id="navCollapse-Btn" data-collapse="navCollapse"
                    class="w3-bar-item w3-button w3-right w3-hide-large w3-hide-medium
                    fa fa-bars main-light-hover"
                    style="font-size: 23px;"></button>
                <button
                    id="theme-Btn"
                    class="w3-bar-item w3-button w3-right fa fa-moon-o main-light-hover"
                    style="font-size: 23px;"></button>
                <!-- Authentication -->
                <div id="authRoot" class="w3-flex w3-right main-light w3-hide"
                    style="margin-top: -6px;">
                    <p id="authUsername"
                        style="padding: 0px 10px 0px 10px;">Logged in as:
                        $username$</p>
                    <button id="logOut-Btn"
                        class="w3-bar-item w3-button fa fa-sign-out w3-right main-light-hover"
                        style="font-size: 23px;"></button>
                </div>
                <div id="logInRoot"
                    class="w3-dropdown-click w3-right w3-animate-top main-light">
                    <button
                        data-collapse="logInCollapse"
                        id="logInCollapse-Btn"
                        class="w3-bar-item w3-button
                            fa fa-key main-light-hover"
                        title="Log in using an API key"
                        style="font-size: 23px;"></button>
                    <div
                        id="logInCollapse"
                        class="w3-dropdown-content w3-bar-block w3-padding main-light h-grad-orange"
                        style="right: 0;top: 39px;">
                        <button id="logInClose-Btn"
                            data-collapse="logInCollapse"
                            class="w3-button w3-right fa fa-close w3-transparent"></button>
                        <h2 class="w3-center">Log in</h2>
                        <input id="keyInput" class="w3-input"
                            style="font-weight: 100;margin-bottom: 20px;"
                            placeholder="Key">
                        <label>
                            <input class="w3-check" value="true" type="checkbox" id="persistCheckbox"> Stay logged in
                        </label>
                        <br><br>
                        <a href="./key_usage.html">Key usage & storing</a>
                        <button id="logIn-Btn" title="Log in"
                            style="width: 100%;margin-top: 20px;"
                            class="w3-button sub-light sub-hover">Log in</button>
                    </div>
                </div>
            </div>
            <div id="navCollapse"
                class="w3-bar-block w3-card w3-hide-large w3-hide-medium
                w3-animate-right w3-hide main-light">
                <button
                    id="warPage-CBtn" data-main="war.html"
                    class="w3-bar-item w3-button main-light-hover">War</button>
                <button id="gntPage-CBtn" data-main="guides_tools.html"
                    class="w3-bar-item w3-button main-light-hover w3-disabled">Guides/Tools</button>
                <button
                    id="abtUsPage-CBtn" data-main="about_us.html"
                    class="w3-bar-item w3-button main-light-hover w3-disabled">About
                    Us</button>
            </div>
            <div class="w3-bar w3-card sub-light">
                <button id="subCollapse-Btn"
                    data-collapse="subCollapse"
                    class="w3-bar-item w3-button w3-text-white fa fa-chevron-down w3-hide-medium w3-hide-large"
                    style="width: 100%;"></button>
                <span id="subCollapse">
                    <button id="scriptsPage-Btn" data-sub="scriptsPage"
                        class="w3-bar-item w3-button sub-hover w3-mobile w3-hide-small">Scripts</button>
                    <button id="etPage-Btn" data-sub="etPage"
                        class="w3-bar-item w3-button sub-hover w3-mobile w3-hide-small">External
                        Tools</button>
                    <button id="guidesPage-Btn" data-sub="guidesPage"
                        class="w3-bar-item w3-button sub-hover w3-mobile w3-hide-small">Guides</button>
                    <button id="tpPage-Btn" data-sub="tpPage"
                        class="w3-bar-item w3-button sub-hover w3-mobile w3-hide-small">Tornpedia</button>
                </span>
            </div>
        </nav>
        <section class="w3-container w3-padding-16">
            <br><br>
            <div class="w3-container w3-card page-light">
                <div class="w3-quarter w3-margin">
                    <p>
                        Coming Soon!
                    </p>
                </div>
            </div>
        </section>
        <footer
            class="w3-container w3-center w3-card-4 w3-cursive w3-margin-top main-light bottom-grad-orange">
            <p><a
                    href="https://www.torn.com/factions.php?step=profile&ID=48684">Torn
                    Community Garden</a> 2023-2026<br> A faction and community @
                <a href="https://www.torn.com">https://www.torn.com</a></p>
            <img style="width: 200px;" alt="Logo"
                src="resources/Graphics/logo.svg">
            <p>For help or questions regarding the
                website, contact Scatterbean on Discord or
                <a
                    href="https://www.torn.com/users.php?XID=3383329">Scatterbean[3383329]</a>
                on Torn.</p>
            <p style="color: lightgrey;font-weight: 100px;">Icons by Font
                Awesome</p>
        </footer>
    </body>
</html>
